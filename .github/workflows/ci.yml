name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install "setuptools>=77" wheel build -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m unittest discover -s src/astrbot_plugin_sharemarket/tests -v
      - run: python scripts/smoke.py
      - run: python scripts/audit-public.py
      - run: python -m build --no-isolation
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
